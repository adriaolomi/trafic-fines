[project]
name = "trafic-fines"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adrià Olomí Farré", email = "adria.olomi.farre@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[project.scripts]
trafic-fines = "trafic_fines:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
